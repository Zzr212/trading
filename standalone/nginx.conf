# Nginx konfiguracija za MT5 Dashboard (Obrnuti Proxy)
# Lokacija na serveru: /etc/nginx/sites-available/mt5-dashboard
# Simbolička veza: ln -s /etc/nginx/sites-available/mt5-dashboard /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name 92.5.176.43 tvoja-domena.com;

    # Gzip kompresija
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Sigurnosna zaglavlja
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # Proxy na Node.js aplikaciju (kada Node.js radi na portu 3000)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Webhook timeout postavke
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
    }

    # Zabrana pristupa skrivenim datotekama (.git, .env, itd.)
    location ~ /\. {
        deny all;
    }
}
